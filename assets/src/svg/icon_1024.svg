  <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#fff0a0"/>
    <stop offset="0.25" stop-color="#ffb02a"/>
    <stop offset="0.6" stop-color="#ff4a10"/>
    <stop offset="1" stop-color="#8a0e04" stop-opacity="0"/>
